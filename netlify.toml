[build]
command = "npm run build:netlify"
publish = "dist/netlify"

[build.environment]
NODE_VERSION = "22"
NETLIFY_NEXT_PLUGIN_SKIP = "true"
NEXT_TELEMETRY_DISABLED = "1"

[[redirects]]
from = "/api/*"
to = "https://bkpmail.dcasgroup.com.br/coberturas/api/:splat"
status = 200
force = true

[[redirects]]
from = "/coberturas"
to = "/"
status = 302

[[redirects]]
from = "/coberturas/*"
to = "/:splat"
status = 302

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache"
Referrer-Policy = "same-origin"
X-Content-Type-Options = "nosniff"
